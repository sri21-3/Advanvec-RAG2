<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multimodal RAG Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e293b; padding: 14px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .controls { display: flex; gap: 8px; align-items: center; }
    input[type="text"] { background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 7px 10px; font-size: 13px; }
    button { background: #2563eb; color: white; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 980px; width: 100%; margin: 0 auto; }
    .msg { max-width: 88%; padding: 14px 18px; border-radius: 10px; line-height: 1.55; font-size: 14px; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; white-space: pre-wrap; word-wrap: break-word; }
    .assistant { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
    .md-body > :first-child { margin-top: 0; }
    .md-body > :last-child { margin-bottom: 0; }
    .md-body h1, .md-body h2, .md-body h3 { margin: 14px 0 8px; line-height: 1.3; color: #f8fafc; }
    .md-body p { margin: 8px 0; }
    .md-body ul, .md-body ol { margin: 8px 0; padding-left: 22px; }
    .md-body li { margin: 4px 0; }
    .md-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; overflow-x: auto; display: block; }
    .md-body th, .md-body td { border: 1px solid #475569; padding: 8px 10px; text-align: left; vertical-align: top; }
    .md-body th { background: #0f172a; color: #93c5fd; font-weight: 600; }
    .md-body tr:nth-child(even) td { background: rgba(15, 23, 42, 0.45); }
    .md-body code { background: #0f172a; padding: 2px 5px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
    .md-body pre { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
    .md-body pre code { background: transparent; padding: 0; }
    .meta { margin-top: 10px; padding-top: 8px; border-top: 1px solid #334155; font-size: 12px; color: #94a3b8; }
    .badge { display: inline-block; background: #0f172a; border: 1px solid #475569; color: #93c5fd; padding: 2px 7px; border-radius: 4px; font-weight: 600; margin-right: 6px; }
    .images { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; }
    .images img { max-width: 340px; border-radius: 6px; border: 1px solid #475569; background: #fff; }
    footer { background: #1e293b; padding: 14px 20px; border-top: 1px solid #334155; }
    #composer { max-width: 980px; margin: 0 auto; display: flex; gap: 10px; }
    #question { flex: 1; padding: 10px 14px; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Intent-Routed Multimodal RAG</h1>
    <div class="controls">
      <label style="font-size:12px; color:#94a3b8;">Session:</label>
      <input id="sessionId" type="text" value="default" style="width:130px;" />
      <button class="secondary" onclick="resetChat()">Reset Session</button>
    </div>
  </header>

  <div id="chat"></div>

  <footer>
    <form id="composer" onsubmit="sendMessage(event)">
      <input id="question" type="text" placeholder="Ask about your PDFs/DOCX, past chat turns, or say hello..." autocomplete="off" required />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </footer>

  <script>
    const chatEl = document.getElementById("chat");
    const questionEl = document.getElementById("question");
    const sessionEl = document.getElementById("sessionId");
    const sendBtn = document.getElementById("sendBtn");

    if (window.marked) {
      marked.setOptions({ gfm: true, breaks: true });
    }

    function renderMarkdownSafe(markdownText) {
      const rawHtml = window.marked ? marked.parse(markdownText || "") : (markdownText || "");
      return window.DOMPurify ? DOMPurify.sanitize(rawHtml) : rawHtml;
    }

    function appendUserMessage(text) {
      const div = document.createElement("div");
      div.className = "msg user";
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function appendAssistantMessage(data, originalQuestion) {
      const div = document.createElement("div");
      div.className = "msg assistant";

      const body = document.createElement("div");
      body.className = "md-body";
      body.innerHTML = renderMarkdownSafe(data.answer);
      div.appendChild(body);

      if (Array.isArray(data.images) && data.images.length > 0) {
        const imgWrap = document.createElement("div");
        imgWrap.className = "images";
        data.images.forEach((imgPath) => {
          const normalized = imgPath.replace(/\\/g, "/").replace(/^data\/extracted_images\//, "");
          const img = document.createElement("img");
          img.src = `/extracted_images/${encodeURIComponent(normalized)}`;
          img.alt = normalized;
          imgWrap.appendChild(img);
        });
        div.appendChild(imgWrap);
      }

      const meta = document.createElement("div");
      meta.className = "meta";
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = data.intent;
      meta.appendChild(badge);

      const details = [];
      if (data.standalone_query && data.standalone_query !== originalQuestion) {
        details.push(`Rewritten: "${data.standalone_query}"`);
      }
      if (Array.isArray(data.sources) && data.sources.length > 0) {
        details.push(`Sources: ${data.sources.join(", ")}`);
      }
      if (details.length > 0) {
        meta.appendChild(document.createTextNode(details.join(" | ")));
      }
      div.appendChild(meta);

      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function sendMessage(event) {
      event.preventDefault();
      const question = questionEl.value.trim();
      const session_id = sessionEl.value.trim() || "default";
      if (!question) return;

      appendUserMessage(question);
      questionEl.value = "";
      questionEl.disabled = true;
      sendBtn.disabled = true;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, session_id }),
        });
        const data = await res.json();
        if (!res.ok) {
          appendAssistantMessage({
            answer: data.detail || "Request failed.",
            intent: "GENERAL",
            standalone_query: question,
            sources: [],
            images: [],
          }, question);
        } else {
          appendAssistantMessage(data, question);
        }
      } catch (err) {
        appendAssistantMessage({
          answer: `Network error: ${err.message}`,
          intent: "GENERAL",
          standalone_query: question,
          sources: [],
          images: [],
        }, question);
      } finally {
        questionEl.disabled = false;
        sendBtn.disabled = false;
        questionEl.focus();
      }
    }

    async function resetChat() {
      const session_id = sessionEl.value.trim() || "default";
      await fetch(`/session/${encodeURIComponent(session_id)}/reset`, { method: "POST" });
      chatEl.innerHTML = "";
    }
  </script>
</body>
</html>
